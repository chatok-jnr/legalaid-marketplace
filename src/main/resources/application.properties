spring.config.import=optional:file:.env[.properties]

spring.application.name=legal_marketplace

# Datasource configuration for postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT configuration (injected from environment variables)
# Required: JWT_SECRET
# Optional: JWT_EXPIRATION_MINUTES (defaults to 15)

#jwt.secret=${JWT_SECRET:}
JWT_EXPIRATION=${JWT_EXPIRATION:900}
JWT_SECRET=${JWT_SECRET:}
# Spring JPA
spring.jpa.hibernate.ddl-auto=update

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-folder=${CLOUDINARY_UPLOAD_FOLDER:}

# File Upload Configuration (Spring Servlet Multipart)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optional: Enable logging for debugging
logging.level.com.cloudinary=DEBUG
logging.level.org.springframework.web=DEBUG

# Server Configuration (if needed)
server.port=${SERVER_PORT:}
